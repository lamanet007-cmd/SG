<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hra - Verze v17</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Galaktické Impérium <span id="game-version">Verze v17</span></h1>
            <div id="resources-bar">
                <span>Naquadah: <strong id="res-naquadah">1000</strong></span>
                <span>Trinium: <strong id="res-trinium">500</strong></span>
                <span>Energie: <strong id="res-energy">0</strong>/<strong id="res-max-energy">100</strong></span>
                <span>Fragmenty: <strong id="res-fragments">0</strong></span>
            </div>
        </header>

        <nav>
            <button onclick="switchTab('overview')">Přehled</button>
            <button onclick="switchTab('base')">Základna</button>
            <button onclick="switchTab('galaxy')">Galaxie</button>
            <button onclick="switchTab('fleet')">Flotila</button>
            <button onclick="switchTab('anomalies')">Anomálie</button>
            <button onclick="switchTab('logs')">Bojová hlášení</button>
        </nav>

        <main>
            <!-- PŘEHLED -->
            <section id="tab-overview" class="tab-content">
                <h2>Přehled impéria</h2>
                <div id="overview-content"></div>
            </section>

            <!-- ZÁKLADNA -->
            <section id="tab-base" class="tab-content" style="display:none;">
                <h2>Budovy a Výzkum</h2>
                <div id="base-content"></div>
            </section>

            <!-- GALAXIE -->
            <section id="tab-galaxy" class="tab-content" style="display:none;">
                <h2>Hvězdná mapa</h2>
                <div id="galaxy-content"></div>
            </section>

            <!-- FLOTILA -->
            <section id="tab-fleet" class="tab-content" style="display:none;">
                <h2>Správa flotil a hangár</h2>
                <div id="fleet-content"></div>
            </section>

            <!-- ANOMÁLIE -->
            <section id="tab-anomalies" class="tab-content" style="display:none;">
                <h2>Průzkum anomálií</h2>
                <div id="anomalies-content"></div>
            </section>

            <!-- BOJOVÁ HLÁŠENÍ -->
            <section id="tab-logs" class="tab-content" style="display:none;">
                <h2>Archiv bitev</h2>
                <div id="logs-content"></div>
            </section>
        </main>

        <footer>
            <p>Stellar Command &copy; 2026 - Verze v17</p>
        </footer>
    </div>

    <script src="game.js"></script>
</body>
</html>
