<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e12">
<title>Stargate: Galaktické velení</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<header>
  <svg id="gate" viewBox="0 0 400 400" role="img" aria-label="Hvězdná brána">
    <defs>
      <radialGradient id="eh"><stop offset="0" stop-color="#e8f8ff"/><stop offset=".45" stop-color="#6cc4ff"/><stop offset="1" stop-color="#1f6fb8"/></radialGradient>
      <radialGradient id="metal"><stop offset=".78" stop-color="#4a5560"/><stop offset=".9" stop-color="#2a323b"/><stop offset="1" stop-color="#1a2027"/></radialGradient>
    </defs>
    <g id="horizon"><circle cx="200" cy="200" r="138" fill="url(#eh)"/>
      <path d="M200 70a130 130 0 0 1 90 40M330 200a130 130 0 0 1-40 90M200 330a130 130 0 0 1-90-40M70 200a130 130 0 0 1 40-90" stroke="#fff" stroke-opacity=".6" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="200" cy="200" r="60" fill="#e8f8ff" fill-opacity=".35"/></g>
    <g id="ring"><circle cx="200" cy="200" r="190" fill="url(#metal)" stroke="#0e1216" stroke-width="3"/>
      <circle cx="200" cy="200" r="140" fill="#0d1014" stroke="#5c6975" stroke-width="3"/>
      <g id="glyphs" fill="none" stroke="#c9a24b" stroke-width="2"></g></g>
    <g id="chevs"></g>
  </svg>
  <div class="title"><h1>Stargate: Galaktické velení</h1><div class="who"><span id="emb"></span><span id="who"></span></div></div>
</header>
<div class="res">
  <div class="n"><small>Naquadah</small><b id="r-n"></b><small id="p-n"></small></div>
  <div class="t"><small>Trinium</small><b id="r-t"></b><small id="p-t"></small></div>
  <div class="p"><small>Planety</small><b id="r-p"></b><small id="p-p"></small></div>
</div>
<main><section id="tab"></section><div id="log" aria-live="polite"></div>
<footer>Fanouškovská hra bez vazby na MGM. <button id="reset">Smazat postup</button></footer></main>
<nav aria-label="Hlavní menu">
  <button data-tab="over" class="act"><i>◈</i>Přehled</button>
  <button data-tab="base"><i>▤</i>Základna</button>
  <button data-tab="lab"><i>⚗</i>Výzkum</button>
  <button data-tab="hangar"><i>➤</i>Flotila</button>
  <button data-tab="map"><i>✺</i>Galaxie</button>
  <button data-tab="dip"><i>⚑</i>Diplomacie</button>
</nav>
<div id="pick" hidden role="dialog" aria-modal="true" aria-labelledby="pt"><div class="pbox">
  <h1 id="pt">Vyber si rasu</h1><p>Každá rasa má jiné bonusy, názvy jednotek a domovský svět.</p>
  <label>Jméno velitele <input id="cmd" maxlength="20" placeholder="Velitel" autocomplete="off"></label>
  <div id="cards"></div></div></div>
<div id="battle" hidden role="dialog" aria-modal="true"><div class="bbox"><h2 id="b-title"></h2>
<small>Tvá flotila</small><div class="bar"><i id="b-a"></i></div><small>Obránci</small><div class="bar"><i id="b-d"></i></div>
<div id="b-res"></div><button class="go" id="b-close">Zavřít hlášení</button></div></div>
<script src="game.js" defer></script>
</body>
</html>
